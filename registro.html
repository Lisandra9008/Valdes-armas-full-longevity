<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title data-i18n="page_title">Crear cuenta | Valdes Armas</title><link rel="icon" href="utls/imgs/valdes-armas-logo.jpeg"><link href="utls/css/valdesarmas.css" rel="stylesheet"><link href="utls/css/app.css" rel="stylesheet"></head><body>
<div class="topbar"><div class="container-va nav"><a class="brand" href="index.html"><img src="utls/imgs/valdes-armas-logo.jpeg" alt="Valdes Armas"><span>VALDES ARMAS<small>LONGEVIDAD PLENA</small></span></a><div class="links"><a href="index.html" data-i18n="nav_home">Inicio</a><a href="marketplace.html" data-i18n="nav_market">Marketplace</a></div><div class="lang-toggle"><span data-lang="es">ES</span><span data-lang="en">EN</span></div></div></div>

<div class="app-shell">
  <div class="auth-card">
    <h1 data-i18n="title">Crear cuenta</h1>
    <p class="sub" data-i18n="subtitle">Registrate para guardar favoritos y chatear con los vendedores.</p>
    <div class="alert alert-error" id="reg-error" style="display:none"></div>
    <div class="alert alert-ok" id="reg-ok" style="display:none"></div>
    <form id="reg-form">
      <div class="field"><label for="nombre" data-i18n="name_label">Nombre</label><input type="text" id="nombre" required></div>
      <div class="field"><label for="email" data-i18n="email_label">Email</label><input type="email" id="email" required></div>
      <div class="field"><label for="password" data-i18n="password_label">Contraseña</label><input type="password" id="password" minlength="6" required></div>
      <button type="submit" class="app-btn primary block" id="reg-btn" data-i18n="submit_btn">Crear cuenta</button>
    </form>
    <p class="auth-switch"><span data-i18n="has_account">¿Ya tenés cuenta?</span> <a href="login.html" data-i18n="login_link">Iniciá sesión</a></p>
  </div>
</div>

<script>
window.I18N = {
  es: {
    page_title: "Crear cuenta | Valdes Armas", nav_home: "Inicio", nav_market: "Marketplace",
    title: "Crear cuenta", subtitle: "Registrate para guardar favoritos y chatear con los vendedores.",
    name_label: "Nombre", email_label: "Email", password_label: "Contraseña", submit_btn: "Crear cuenta",
    has_account: "¿Ya tenés cuenta?", login_link: "Iniciá sesión",
    creating: "Creando cuenta...", success: "Cuenta creada. Revisá tu email para confirmar y después iniciá sesión."
  },
  en: {
    page_title: "Sign up | Valdes Armas", nav_home: "Home", nav_market: "Marketplace",
    title: "Create account", subtitle: "Sign up to save favorites and chat with sellers.",
    name_label: "Name", email_label: "Email", password_label: "Password", submit_btn: "Create account",
    has_account: "Already have an account?", login_link: "Log in",
    creating: "Creating account...", success: "Account created. Check your email to confirm, then log in."
  }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utls/js/supabase-config.js"></script>
<script src="utls/js/i18n.js"></script>
<script>
document.getElementById('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const lang = (window.VA_I18N && window.VA_I18N.getLang()) || 'es';
  const dict = window.I18N[lang];
  const btn = document.getElementById('reg-btn');
  const errorBox = document.getElementById('reg-error');
  const okBox = document.getElementById('reg-ok');
  errorBox.style.display = 'none'; okBox.style.display = 'none';
  btn.disabled = true; btn.textContent = dict.creating;

  const nombre = document.getElementById('nombre').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { error } = await supabaseClient.auth.signUp({
    email, password,
    options: { data: { nombre } }
  });

  btn.disabled = false; btn.textContent = dict.submit_btn;

  if (error) {
    errorBox.textContent = error.message;
    errorBox.style.display = 'block';
    return;
  }
  okBox.textContent = dict.success;
  okBox.style.display = 'block';
  document.getElementById('reg-form').reset();
});
</script>
</body></html>
