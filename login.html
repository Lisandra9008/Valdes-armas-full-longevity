<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión | Valdes Armas</title><link rel="icon" href="utls/imgs/valdes-armas-logo.jpeg"><link href="utls/css/valdesarmas.css" rel="stylesheet"><link href="utls/css/app.css" rel="stylesheet"></head><body>
<div class="topbar"><div class="container-va nav"><a class="brand" href="index.html"><img src="utls/imgs/valdes-armas-logo.jpeg" alt="Valdes Armas"><span>VALDES ARMAS<small>LONGEVIDAD PLENA</small></span></a><div class="links"><a href="index.html">Inicio</a><a href="marketplace.html">Marketplace</a></div></div></div>

<div class="app-shell">
  <div class="auth-card">
    <h1>Iniciar sesión</h1>
    <p class="sub">Entrá con tu cuenta para publicar productos o chatear con vendedores.</p>
    <div class="alert alert-error" id="login-error" style="display:none"></div>
    <form id="login-form">
      <div class="field"><label for="email">Email</label><input type="email" id="email" required></div>
      <div class="field"><label for="password">Contraseña</label><input type="password" id="password" required></div>
      <button type="submit" class="app-btn primary block" id="login-btn">Entrar</button>
    </form>
    <p class="auth-switch">¿No tenés cuenta? <a href="registro.html">Registrate acá</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utls/js/supabase-config.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errorBox = document.getElementById('login-error');
  errorBox.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Entrando...';

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    errorBox.textContent = error.message === 'Invalid login credentials'
      ? 'Email o contraseña incorrectos.'
      : error.message;
    errorBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }
  window.location.href = 'marketplace.html';
});
</script>
</body></html>
